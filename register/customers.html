<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Kunderegister | Sherwani Gull &amp; Sølv</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">
      <div class="logo-icon">♦</div>
      <div>
        <div class="logo-text">Sherwani</div>
        <div class="logo-subtitle">Internt register</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="nav-section-label">Oversikt</span>
    <a href="index.html" class="nav-link">
      <span class="nav-icon">▦</span> Oversikt
    </a>
    <span class="nav-section-label">Administrasjon</span>
    <a href="customers.html" class="nav-link active">
      <span class="nav-icon">👤</span> Kunder
    </a>
    <a href="transactions.html" class="nav-link">
      <span class="nav-icon">⇅</span> Transaksjoner
    </a>
    <span class="nav-section-label">System</span>
    <a href="settings.html" class="nav-link">
      <span class="nav-icon">⚙</span> Innstillinger
    </a>
  </nav>
  <div class="sidebar-footer">Sherwani Gull &amp; Sølv</div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Kunder</div>
      <div class="page-subtitle" id="sub-count"></div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openModal('modal-add-customer')">+ Legg til kunde</button>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Søk på navn, e-post eller telefon…" oninput="renderTable()">
        </div>
        <button class="btn btn-secondary" onclick="sortBy('name')">A–Z</button>
        <button class="btn btn-secondary" onclick="sortBy('createdAt')">Nyeste</button>
        <button class="btn btn-secondary" onclick="sortBy('total')">Høyest verdi</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Kunde</th>
              <th>Telefon</th>
              <th>E-post</th>
              <th>Registrert</th>
              <th style="text-align:right">Total omsetning</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="customers-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- MODAL: Legg til kunde -->
<div class="modal-overlay" id="modal-add-customer">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Legg til kunde</div>
      <button class="modal-close" onclick="closeModal('modal-add-customer')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Fullt navn *</label>
          <input type="text" id="f-name" placeholder="Ola Nordmann">
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input type="tel" id="f-phone" placeholder="91 23 45 67">
        </div>
      </div>
      <div class="form-group">
        <label>E-post</label>
        <input type="email" id="f-email" placeholder="ola@example.no">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="f-address" placeholder="Gata 1, 0001 Oslo">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Type legitimasjon</label>
          <input type="text" id="f-id-type" placeholder="Pass, førerkort, bankkort">
        </div>
        <div class="form-group">
          <label>Legitimasjonsnummer</label>
          <input type="text" id="f-id-number" placeholder="Dokumentnummer">
        </div>
      </div>
      <div class="form-group">
        <label>Notater</label>
        <textarea id="f-notes" placeholder="Interne notater om kunden…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-add-customer')">Avbryt</button>
      <button class="btn btn-primary" onclick="addCustomer()">Legg til kunde</button>
    </div>
  </div>
</div>

<!-- MODAL: Rediger kunde -->
<div class="modal-overlay" id="modal-edit-customer">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Rediger kunde</div>
      <button class="modal-close" onclick="closeModal('modal-edit-customer')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="e-id">
      <div class="form-row">
        <div class="form-group">
          <label>Fullt navn *</label>
          <input type="text" id="e-name" placeholder="Ola Nordmann">
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input type="tel" id="e-phone" placeholder="91 23 45 67">
        </div>
      </div>
      <div class="form-group">
        <label>E-post</label>
        <input type="email" id="e-email" placeholder="ola@example.no">
      </div>
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" id="e-address" placeholder="Gata 1, 0001 Oslo">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Type legitimasjon</label>
          <input type="text" id="e-id-type" placeholder="Pass, førerkort, bankkort">
        </div>
        <div class="form-group">
          <label>Legitimasjonsnummer</label>
          <input type="text" id="e-id-number" placeholder="Dokumentnummer">
        </div>
      </div>
      <div class="form-group">
        <label>Notater</label>
        <textarea id="e-notes" placeholder="Interne notater om kunden…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="deleteCustomer()">Slett kunde</button>
      <button class="btn btn-secondary" onclick="closeModal('modal-edit-customer')">Avbryt</button>
      <button class="btn btn-primary" onclick="saveCustomer()">Lagre endringer</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  let currentSort = 'createdAt';

  function computeRows() {
    const customers    = getCustomers();
    const transactions = getTransactions();
    const q = document.getElementById('search-input').value.toLowerCase().trim();

    return customers.map(c => ({
      ...c,
      total: transactions.filter(t => t.customerId === c.id).reduce((s,t) => s+transactionAmount(t), 0),
      txCount: transactions.filter(t => t.customerId === c.id).length
    })).filter(c => !q ||
      c.name.toLowerCase().includes(q) ||
      (c.email || '').toLowerCase().includes(q) ||
      (c.phone||'').includes(q)
    ).sort((a,b) => {
      if (currentSort === 'name')      return a.name.localeCompare(b.name, 'nb');
      if (currentSort === 'total')     return b.total - a.total;
      if (currentSort === 'createdAt') return new Date(b.createdAt) - new Date(a.createdAt);
      return 0;
    });
  }

  function renderTable() {
    const rows = computeRows();
    document.getElementById('sub-count').textContent = rows.length + ' kunder';
    document.getElementById('customers-tbody').innerHTML = rows.map(c => `
      <tr>
        <td>
          <a href="customer-profile.html?id=${Number(c.id)}" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">
            <div style="width:36px;height:36px;background:linear-gradient(135deg,var(--gold-dim),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fffaf0;flex-shrink:0">${escapeHtml(getInitials(c.name))}</div>
            <div>
              <div style="font-weight:600;color:var(--text-primary)">${escapeHtml(c.name)}</div>
              <div style="font-size:12px;color:var(--text-muted)">${c.txCount} transaksjon${c.txCount!==1?'er':''}</div>
            </div>
          </a>
        </td>
        <td>${escapeHtml(c.phone || '–')}</td>
        <td>${escapeHtml(c.email || '–')}</td>
        <td style="color:var(--text-muted)">${formatDate(c.createdAt)}</td>
        <td style="text-align:right;font-weight:700;color:var(--gold)">${formatAmount(c.total)}</td>
        <td style="text-align:right">
          <button class="btn btn-secondary btn-sm" onclick="openEdit(${Number(c.id)})">Rediger</button>
        </td>
      </tr>
    `).join('') || `<tr><td colspan="6"><div class="empty-state"><div class="empty-state-icon">👤</div><p>Ingen kunder funnet</p></div></td></tr>`;
  }

  function sortBy(field) {
    currentSort = field;
    renderTable();
  }

  function addCustomer() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { showToast('Navn er påkrevd', '⚠'); return; }
    const customers = getCustomers();
    customers.push({
      id: nextId(customers),
      name,
      email:   document.getElementById('f-email').value.trim(),
      phone:   document.getElementById('f-phone').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      idType:  document.getElementById('f-id-type').value.trim(),
      idNumber: document.getElementById('f-id-number').value.trim(),
      notes:   document.getElementById('f-notes').value.trim(),
      createdAt: new Date().toISOString().slice(0,10)
    });
    setCustomers(customers);
    closeModal('modal-add-customer');
    document.getElementById('f-name').value = '';
    document.getElementById('f-email').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-address').value = '';
    document.getElementById('f-id-type').value = '';
    document.getElementById('f-id-number').value = '';
    document.getElementById('f-notes').value = '';
    renderTable();
    showToast('Kunde lagt til');
  }

  function openEdit(id) {
    const c = getCustomerById(id);
    if (!c) return;
    document.getElementById('e-id').value      = c.id;
    document.getElementById('e-name').value    = c.name;
    document.getElementById('e-email').value   = c.email;
    document.getElementById('e-phone').value   = c.phone;
    document.getElementById('e-address').value = c.address;
    document.getElementById('e-id-type').value = c.idType || '';
    document.getElementById('e-id-number').value = c.idNumber || '';
    document.getElementById('e-notes').value   = c.notes;
    openModal('modal-edit-customer');
  }

  function saveCustomer() {
    const id   = Number(document.getElementById('e-id').value);
    const name = document.getElementById('e-name').value.trim();
    if (!name) { showToast('Navn er påkrevd', '⚠'); return; }
    const customers = getCustomers().map(c => c.id !== id ? c : {
      ...c,
      name,
      email:   document.getElementById('e-email').value.trim(),
      phone:   document.getElementById('e-phone').value.trim(),
      address: document.getElementById('e-address').value.trim(),
      idType:  document.getElementById('e-id-type').value.trim(),
      idNumber: document.getElementById('e-id-number').value.trim(),
      notes:   document.getElementById('e-notes').value.trim(),
    });
    setCustomers(customers);
    closeModal('modal-edit-customer');
    renderTable();
    showToast('Kunde oppdatert');
  }

  function deleteCustomer() {
    if (getSettings().confirmDelete !== false && !confirm('Er du sikker på at du vil slette denne kunden?\nAlle tilknyttede transaksjoner beholdes.')) return;
    const id = Number(document.getElementById('e-id').value);
    setCustomers(getCustomers().filter(c => c.id !== id));
    closeModal('modal-edit-customer');
    renderTable();
    showToast('Kunde slettet', '🗑');
  }

  renderTable();
</script>
</body>
</html>
