<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Registeroversikt | Sherwani Gull &amp; Sølv</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">
      <div class="logo-icon">♦</div>
      <div>
        <div class="logo-text">Sherwani</div>
        <div class="logo-subtitle">Internt register</div>
      </div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="nav-section-label">Oversikt</span>
    <a href="index.html" class="nav-link active">
      <span class="nav-icon">▦</span> Oversikt
    </a>
    <span class="nav-section-label">Administrasjon</span>
    <a href="customers.html" class="nav-link">
      <span class="nav-icon">👤</span> Kunder
    </a>
    <a href="transactions.html" class="nav-link">
      <span class="nav-icon">⇅</span> Transaksjoner
    </a>
    <span class="nav-section-label">System</span>
    <a href="settings.html" class="nav-link">
      <span class="nav-icon">⚙</span> Innstillinger
    </a>
  </nav>
  <div class="sidebar-footer">Sherwani Gull &amp; Sølv</div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Registeroversikt</div>
      <div class="page-subtitle" id="today-str"></div>
    </div>
    <div class="topbar-actions">
      <a href="customers.html" class="btn btn-secondary">+ Ny kunde</a>
      <a href="transactions.html" class="btn btn-primary">+ Registrer betaling</a>
    </div>
  </div>

  <div class="content">
    <div class="stats-grid" id="stats-grid"></div>

    <div class="grid-2">
      <!-- Recent transactions -->
      <div class="card" style="grid-column:1/2">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <div class="card-title" style="margin-bottom:0">Siste transaksjoner</div>
          <a href="transactions.html" class="btn btn-secondary btn-sm">Se alle →</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Kunde</th>
                <th>Beskrivelse</th>
                <th>Betaling</th>
                <th>Dato</th>
                <th style="text-align:right">Beløp</th>
              </tr>
            </thead>
            <tbody id="recent-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Top customers -->
      <div class="card">
        <div class="card-title">Toppkunder</div>
        <div id="top-customers"></div>
      </div>
    </div>
  </div>
</main>

<script src="script.js"></script>
<script>
  document.getElementById('today-str').textContent =
    new Date().toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  const customers    = getCustomers();
  const transactions = getTransactions();

  const now = new Date();
  const monthTx   = transactions.filter(t => { const d = new Date(t.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
  const totalRev  = transactions.reduce((s,t) => s+transactionAmount(t), 0);
  const monthRev  = monthTx.reduce((s,t) => s+transactionAmount(t), 0);
  const avgAmount = transactions.length ? Math.round(totalRev / transactions.length) : 0;
  const cashTx = transactions.filter(t => t.payment === 'kontant');
  const cashTotal = cashTx.reduce((s,t) => s + transactionAmount(t), 0);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card">
      <div class="stat-label">Kunder</div>
      <div class="stat-value">${customers.length}</div>
      <div class="stat-sub">↑ Registrerte kunder</div>
      <div class="stat-icon">👥</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Transaksjoner totalt</div>
      <div class="stat-value">${transactions.length}</div>
      <div class="stat-sub">${monthTx.length} denne måneden</div>
      <div class="stat-icon">⇅</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Kontantbetaling</div>
      <div class="stat-value gold">${formatAmount(cashTotal)}</div>
      <div class="stat-sub">${cashTx.length} handler registrert</div>
      <div class="stat-icon">📈</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Denne måneden</div>
      <div class="stat-value gold">${formatAmount(monthRev)}</div>
      <div class="stat-sub">${monthTx.length} handler · snitt ${formatAmount(avgAmount)}</div>
      <div class="stat-icon">💰</div>
    </div>
  `;

  const recent = [...transactions].sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,8);
  document.getElementById('recent-tbody').innerHTML = recent.map(t => {
    const c = getCustomerById(t.customerId);
    const signedAmount = transactionAmount(t);
    return `<tr style="cursor:pointer" onclick="location.href='customer-profile.html?id=${Number(t.customerId)}'">
      <td><strong>${c ? escapeHtml(c.name) : '–'}</strong></td>
      <td>${escapeHtml(t.description)}</td>
      <td>${paymentBadge(t.payment)}</td>
      <td style="color:var(--text-muted)">${formatDate(t.date)}</td>
      <td style="text-align:right" class="${signedAmount < 0 ? 'amount-negative' : 'amount-gold'}">${formatAmount(signedAmount)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5"><div class="empty-state"><div class="empty-state-icon">⇅</div><p>Ingen transaksjoner ennå</p></div></td></tr>`;

  const ranked = customers.map(c => ({
    ...c,
    total: transactions.filter(t=>t.customerId===c.id).reduce((s,t)=>s+transactionAmount(t),0),
    count: transactions.filter(t=>t.customerId===c.id).length
  })).sort((a,b)=>b.total-a.total).slice(0,5);

  document.getElementById('top-customers').innerHTML = ranked.map((c,i) => `
    <a href="customer-profile.html?id=${Number(c.id)}" style="text-decoration:none;display:block">
      <div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);transition:opacity .15s" onmouseenter="this.style.opacity='.8'" onmouseleave="this.style.opacity='1'">
        <div style="font-size:12px;color:var(--text-muted);width:16px;text-align:center;font-weight:600">${i+1}</div>
        <div style="width:38px;height:38px;background:linear-gradient(135deg,var(--gold-dim),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fffaf0;flex-shrink:0">${escapeHtml(getInitials(c.name))}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;color:var(--text-primary);font-weight:500">${escapeHtml(c.name)}</div>
          <div style="font-size:12px;color:var(--text-muted)">${c.count} transaksjon${c.count!==1?'er':''}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--gold)">${formatAmount(c.total)}</div>
      </div>
    </a>
  `).join('') || '<p style="color:var(--text-muted);font-size:13px;padding:16px 0">Ingen kunder ennå</p>';
</script>
</body>
</html>
